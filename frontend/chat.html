<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Microsoft Graph Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="chat-view">

        <header>

            <div class="header-left">
                <h2>Microsoft Graph Assistant</h2>
            </div>

            <div class="header-right">

                <span id="user-info"></span>

                <button
                    id="logout-btn"
                    class="logout-btn"
                    onclick="logout()">
                    Logout
                </button>

            </div>

        </header>

        <main id="messages">

        </main>

        <form id="chat-form">

            <input
                id="chat-input"
                type="text"
                placeholder="Ask me anything..."
                autocomplete="off"
            />

            <button type="submit">
                Send
            </button>

        </form>

    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
    <script src="auth.js"></script>
    <script src="app.js"></script>

</body>

</html>
